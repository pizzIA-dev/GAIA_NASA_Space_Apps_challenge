# Integración continua (plan §16, §21.3). Sin credenciales de Earth Engine: las pruebas usan motor estadístico,
# adaptadores simulados (unitarias) y fixtures con series NASA REALES ya extraídas (E2E, scientific/fixtures/e2e).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Earth Engine deshabilitado a propósito en CI: lo no cacheado responde 503 source_unavailable, nunca datos falsos.
  EE_PROJECT: ""
  EE_SERVICE_ACCOUNT_FILE: ""

jobs:
  api:
    name: API y SDK (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Instalar backend y SDK
        run: python -m pip install -e "apps/api[dev]" -e packages/python-sdk
      - name: Ruff
        working-directory: apps/api
        run: python -m ruff check app tests ../../scripts ../../packages/python-sdk/src --config pyproject.toml
      - name: Pytest
        working-directory: apps/api
        run: python -m pytest -q

  web:
    name: Web (contraste + tipos + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Contraste WCAG de los tokens
        run: npm run check:contrast
      - name: Tokens y worker de MapLibre
        run: npm run tokens && npm run assets
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build de producción
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E Playwright (fixtures NASA, sin Earth Engine)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, web]
    env:
      CI: "1"
      CACHE_DIR: .cache_ci
      PW_CHANNEL: ""
      API_CMD: python -m uvicorn app.main:app --app-dir ../api --port 8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar backend
        run: python -m pip install -e "apps/api[dev]" -e packages/python-sdk
      - name: Sembrar caché desde fixtures
        run: python scripts/e2e_fixtures.py seed .cache_ci
      - name: Instalar web y Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
