[project]
name = "earth-trend-api"
version = "0.1.0"
description = "Backend científico (FastAPI) de Earth Trend Studio — nombre provisional"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
gee = ["earthengine-api>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
